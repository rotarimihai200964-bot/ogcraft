name: OGCraft status monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Minecraft server
        env:
          MC_SERVER: mc.ogcraft-rpg.com
        run: node botogcraft/monitor-status.mjs
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]users.noreply.github.com"
          git add botogcraft/status.json
          git diff --cached --quiet || git commit -m "Update OGCraft server status"
          git push
